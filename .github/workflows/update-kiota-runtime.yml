name: Update Kiota Runtime

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  check-runtime:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run update-runtime script
        shell: pwsh
        run: ./scripts/update-runtime.ps1

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/kiota/runtime.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated runtime manifest
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiota-runtime-update
          path: src/kiota/runtime.json
          if-no-files-found: error

  create-runtime-pr:
    needs: check-runtime
    if: needs.check-runtime.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download updated runtime manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kiota-runtime-update
          path: ${{ runner.temp }}/kiota-runtime-update

      - name: Copy updated runtime manifest
        shell: bash
        run: cp -- "$RUNNER_TEMP/kiota-runtime-update/runtime.json" src/kiota/runtime.json

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_TOKEN_PROVIDER_PEM }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR with changes
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          app_login="${APP_SLUG}[bot]"
          user_id=$(gh api "users/$app_login" --jq .id)
          git config user.name "$app_login"
          git config user.email "$user_id+$app_login@users.noreply.github.com"

          branch="update-kiota-runtime-$(date -u +%Y-%m-%d-%H%M%S)"
          git switch -c "$branch"
          git add -- src/kiota/runtime.json
          git commit -m "feat(emitter): updates kiota version"

          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "$branch"
          pr_url=$(gh pr create --title "feat(emitter): updates kiota version" --body "Automated update of Kiota runtime dependencies" --base main --head "$branch")
          gh pr merge "$pr_url" --auto --merge -d
